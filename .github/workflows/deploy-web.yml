# Deploy fizzyed.it: this repo's static landing (docs/) and two builds of the fizzy browser app,
# made by fizzyedit/fizzy's `web.yml` and left here as release assets:
#
#   web-main     → /app/      the real app, built from fizzy's main
#   web-preview  → /testapp/  a test build of a fizzy pull request (the latest one), with
#                             browser storage of its own; absent until there has been one
#
# Pages publishes the whole site at once, so every deploy lays out both, whichever one changed.
# Reading this repo's own releases needs no token beyond the workflow's.
#
# One-time repo setup: Settings → Pages → Build and deployment → Source: GitHub Actions. Set the
# custom domain to fizzyed.it (docs/CNAME is copied into the published artifact).
#
# Redeploys on: this repo's docs/ pushes, a repository_dispatch from fizzyedit/fizzy (a new
# build, or a new release the site links), or a manual run.

name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-web.yml"
  repository_dispatch:
    types: [fizzy-updated]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website (docs/, CNAME)
        uses: actions/checkout@v4

      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          cp -R docs/. site/

          gh release download web-main --repo "$GITHUB_REPOSITORY" --pattern web.zip --output main.zip
          mkdir -p site/app
          unzip -q main.zip -d site/app
          cat site/app/build.json

          if gh release download web-preview --repo "$GITHUB_REPOSITORY" --pattern web.zip --output preview.zip; then
            mkdir -p site/testapp
            unzip -q preview.zip -d site/testapp
            cat site/testapp/build.json
          else
            echo "No test build yet: /testapp/ is left out."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
